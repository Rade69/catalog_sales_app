[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::ResourceWarning
    ignore::DeprecationWarning

[coverage:run]
source = app/services
branch = True
omit = 
    */tests/*
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
show_missing = True
precision = 1
